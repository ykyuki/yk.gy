<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yk.gy — URL短縮</title>
  <meta name="description" content="長いURLを7文字の短いURLに変換します。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>yk.gy</h1>
      <p class="lead">長いURLを短く。登録不要・無期限で使える短縮URLサービスです。</p>
    </header>

    <form id="shorten-form" class="card" novalidate>
      <label for="url-input">短縮したいURL</label>
      <div class="row">
        <input id="url-input" name="url" type="url" inputmode="url" autocomplete="url"
               placeholder="https://example.com/very/long/path" maxlength="2048" required>
        <button id="submit-btn" type="submit">短縮する</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="card result" hidden aria-live="polite">
      <p class="label">短縮URL</p>
      <div class="row">
        <input id="short-url" type="text" readonly aria-label="短縮URL">
        <button id="copy-btn" type="button">コピー</button>
      </div>
      <p class="original">元のURL: <span id="original-url"></span></p>
      <p id="copy-status" class="status" role="status"></p>
    </section>

    <footer>
      <p>登録されたURLは Google Safe Browsing で安全性を確認しています。危険と判定されたURLは登録できません。</p>
      <p class="env" id="env-badge" hidden></p>
    </footer>
  </main>
</body>
</html>
